<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0418">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TRS Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="speedlines"></div>
<div id="vignette"></div>
<div id="flash"></div>

<!-- 遊戲中介面 -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="hud-l"><div class="big" id="score">0</div><div class="lbl">SCORE</div><div class="sub"><span id="time">0:00.0</span> · ◆<span id="credits">0</span></div></div>
    <div class="hud-c"><div id="phase">WAVE 1/3</div><div class="bar thin"><i id="progress"></i></div></div>
    <div class="hud-r"><div class="big" id="kills">0</div><div class="lbl">KILLS</div></div>
  </div>
  <div class="hud-bars">
    <div class="bar hull"><i id="hull"></i><span>船體</span></div>
    <div class="bar energy"><i id="energy"></i><span>能量</span></div>
  </div>
  <div id="bossbar" class="hidden"><div class="bb-name">GUARDIAN <span id="bossState"></span></div><div class="bar boss"><i id="bosshp"></i></div></div>
  <div id="banner"><div class="b1"></div><div class="b2"></div></div>
  <div id="toasts"></div>
  <button id="btnBoost" class="btn-round"><b>BOOST</b><span id="boostPips"></span></button>
  <div id="weapons"></div>
  <button id="btnHack" class="hidden">⌬ HACK<small>破解護盾</small></button>
  <div class="hud-corner"><button id="btnCal" title="重新校正陀螺儀">◎</button><button id="btnPause" title="暫停">❚❚</button></div>
</div>

<!-- 破解小遊戲 -->
<div id="hack" class="overlay hack hidden">
  <div class="hack-panel">
    <div class="hack-title"></div>
    <div class="hack-info"></div>
    <div class="hack-time"><i></i></div>
    <div class="hack-grid"></div>
    <div class="hack-legend"><span class="lg s">起點</span><span class="lg g">終點</span><span class="lg b">◆ 加成</span><span class="lg x">障壁</span></div>
  </div>
</div>

<!-- 三選一 -->
<div id="choice" class="overlay hidden">
  <div class="panel wide">
    <h2>資料閘門 · 選擇一項強化</h2>
    <div id="cards" class="cards"></div>
  </div>
</div>

<!-- 標題 -->
<div id="title" class="overlay">
  <div class="panel title-panel">
    <h1 class="logo">TRS<span>RUSH</span></h1>
    <p class="tag">WORMHOLE RUNNER · 蟲洞跑酷射擊</p>
    <label class="field">機師代號 <input id="pilot" maxlength="12" placeholder="PILOT" autocomplete="off"></label>
    <div class="opts">
      <label>陀螺儀靈敏度
        <select id="sens"><option value="0">低</option><option value="1" selected>中</option><option value="2">高</option></select>
      </label>
      <label class="chk"><input type="checkbox" id="invert"> 上下反轉</label>
    </div>
    <button id="btnStart" class="btn primary">啟動引擎</button>
    <button id="btnBoard" class="btn">排行榜</button>
    <p class="help">手機：橫向持握，傾斜機身操控 · 手指拖曳微調 · 快速左右滑動＝翻滾閃避<br>電腦：滑鼠／WASD 移動 · 1–4 換武器 · 空白鍵 加速 · H 破解 · Q/E 翻滾 · Esc 暫停</p>
  </div>
</div>

<div id="result" class="overlay hidden"><div class="panel" id="resultBody"></div></div>
<div id="shop" class="overlay hidden"><div class="panel wide" id="shopBody"></div></div>
<div id="over" class="overlay hidden"><div class="panel" id="overBody"></div></div>

<div id="board" class="overlay hidden">
  <div class="panel wide">
    <h2>排行榜</h2>
    <div class="tabs" id="boardTabs">
      <button data-cat="score" class="on">總分</button>
      <button data-cat="fast">最快通關</button>
      <button data-cat="kills">最多擊落</button>
      <button data-cat="flawless">無損通關</button>
    </div>
    <ol id="boardList" class="board"></ol>
    <button class="btn" id="btnBoardClose">關閉</button>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="panel">
    <h2>暫停</h2>
    <button class="btn primary" id="btnResume">繼續</button>
    <button class="btn" id="btnRecal">重新校正陀螺儀</button>
    <button class="btn" id="btnQuit">結束航程</button>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
