<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0418">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TRS Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="hud.css">
<script type="importmap">{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="speedlines"></div>
<div id="vignette"></div>
<div id="flash"></div>

<!-- 遊戲中介面：直式為主、右手單手可操作（方案 C：變形形態＋飛彈） -->
<div id="hud" class="hidden">
  <div class="topbar">
    <div class="tb-score"><b id="score">0</b><span><i>◆</i><em id="credits">0</em></span></div>
    <div class="tb-mid">
      <div class="tb-wave"><span id="phase">WAVE 1/3</span><div class="seg"><i id="progress"></i></div></div>
      <div id="bossbar" class="hidden"><span class="bb-name">NEMESIS <em id="bossState"></em></span><div class="seg boss"><i id="bosshp"></i></div></div>
    </div>
    <button id="btnPause" aria-label="暫停">❚❚</button>
  </div>
  <div id="comm" class="comm"><div class="face"></div><p></p></div>
  <div id="banner"><div class="b1"></div><div class="b2"></div></div>
  <div id="toasts"></div>
  <div id="shipbars"><div class="hb"><i id="hull"></i></div><div class="eb"><i id="energy"></i></div></div>
  <div id="hitdir"></div>
  <div id="modes"></div>
  <button id="btnHack" class="hidden">⌬ HACK<small>破解護盾</small></button>
  <button id="btnBoost" class="fold" aria-label="摺疊躍遷"><i>⚡</i><b>FOLD</b><span id="boostCount">×1</span></button>
  <button id="btnMissile" class="msl" aria-label="飛彈：按住鎖定，放開發射"><span class="ring"></span><span class="core"><b>MISSILE</b><small>按住鎖定</small><em id="missileCount">6</em></span></button>
</div>

<!-- 新手教學提示 -->
<div id="tutTip" class="tut-tip hidden"><div class="tt-step" id="tutStep"></div><div class="tt-main" id="tutMain"></div><div class="tt-sub" id="tutSub"></div></div>
<button id="btnSkipTut" class="skip-tut hidden">跳過教學</button>

<!-- 立繪劇情 -->
<div id="story" class="story hidden">
  <div class="st-bg"></div>
  <div class="st-char"></div>
  <div class="st-top"><span>PROLOGUE · 訊號接通</span><button id="stSkip">跳過 ▸▸</button></div>
  <div class="st-box" id="stBox"><div class="st-name">QUEEN<small>駭客女王</small></div><p id="stText"></p><span class="st-next">▼</span></div>
  <div class="st-choices" id="stChoices"></div>
</div>

<!-- 破解小遊戲 -->
<div id="hack" class="overlay hack hidden">
  <div class="hack-panel">
    <div class="hack-head"><div class="face"></div><div><div class="hack-title"></div><div class="hack-info"></div></div></div>
    <div class="hack-time"><i></i></div>
    <div class="hack-grid"></div>
    <div class="hack-legend"><span class="lg s">起點</span><span class="lg g">終點</span><span class="lg b">◆ 加成</span><span class="lg x">障壁</span></div>
  </div>
</div>

<!-- 三選一 -->
<div id="choice" class="overlay hidden">
  <div class="panel wide holo">
    <div class="hack-head"><div class="face"></div><div><div class="hack-title">資料閘門</div><div class="hack-info">「選一個吧，指揮官。」</div></div></div>
    <div id="cards" class="cards"></div>
  </div>
</div>

<!-- 標題 -->
<div id="title" class="overlay">
  <div class="panel title-panel">
    <h1 class="logo">TRS<span>RUSH</span></h1>
    <p class="tag">WORMHOLE RUNNER · 蟲洞跑酷射擊</p>
    <label class="field">機師代號 <input id="pilot" maxlength="12" placeholder="PILOT" autocomplete="off"></label>
    <div class="opts">
      <label>陀螺儀
        <select id="sens"><option value="0">低</option><option value="1" selected>中</option><option value="2">高</option></select>
      </label>
      <label>畫質
        <select id="quality"><option value="0">低（省電）</option><option value="1">中</option><option value="2">高</option></select>
      </label>
      <label class="chk"><input type="checkbox" id="invert"> 上下反轉</label>
      <label class="chk"><input type="checkbox" id="lefty"> 左手模式</label>
    </div>
    <button id="btnStart" class="btn primary">啟動引擎</button>
    <div class="btn-row"><button id="btnTutorial" class="btn">重玩教學</button><button id="btnBoard" class="btn">排行榜</button></div>
    <p class="help">手機：直拿，傾斜機身移動 · 手指拖曳微調 · 快速左右滑＝翻滾閃避<br>電腦：滑鼠／WASD 移動 · 1–3 變形 · 按住 F 鎖定飛彈 · 空白鍵 躍遷 · H 破解 · Esc 暫停</p>
  </div>
</div>

<div id="result" class="overlay hidden"><div class="panel" id="resultBody"></div></div>
<div id="shop" class="overlay hidden"><div class="panel wide" id="shopBody"></div></div>
<div id="over" class="overlay hidden"><div class="panel" id="overBody"></div></div>

<div id="board" class="overlay hidden">
  <div class="panel wide">
    <h2>排行榜</h2>
    <div class="tabs" id="boardTabs">
      <button data-cat="score" class="on">總分</button>
      <button data-cat="fast">最快通關</button>
      <button data-cat="kills">最多擊落</button>
      <button data-cat="flawless">無損通關</button>
    </div>
    <ol id="boardList" class="board"></ol>
    <button class="btn" id="btnBoardClose">關閉</button>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="panel">
    <h2>暫停</h2>
    <button class="btn primary" id="btnResume">繼續</button>
    <button class="btn" id="btnRecal">重新校正陀螺儀</button>
    <button class="btn" id="btnQuit">結束航程</button>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
